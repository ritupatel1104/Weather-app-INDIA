<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Weather Live</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter,Arial,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:#0f172a;
      color:#fff;
      transition:background 1s ease;
      position:relative;
      padding:20px;
    }

    #rain{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .drop{
      position:absolute;
      width:2px;
      height:70px;
      background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.8));
      animation:fall linear infinite;
    }

    @keyframes fall{
      from{ transform:translateY(-100px);}
      to{ transform:translateY(110vh);}
    }

    .card{
      width:100%;
      max-width:380px;
      padding:28px;
      border-radius:28px;
      background:rgba(15,23,42,.55);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(18px);
      box-shadow:0 25px 60px rgba(0,0,0,.45);
      z-index:2;
    }

    .app-title{
      text-align:center;
      margin-bottom:20px;
    }

    .app-title h1{
      font-size:32px;
      font-weight:800;
      letter-spacing:1px;
    }

    .app-title p{
      color:#94a3b8;
      font-size:14px;
      margin-top:6px;
    }

    .top{
      display:flex;
      gap:10px;
      margin-bottom:22px;
    }

    input{
      flex:1;
      padding:14px 16px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.08);
      color:#fff;
      font-size:15px;
      outline:none;
    }

    input::placeholder{
      color:#94a3b8;
    }

    button{
      border:none;
      border-radius:16px;
      padding:0 18px;
      background:#2563eb;
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition:.2s;
    }

    button:hover{
      transform:translateY(-1px);
      background:#1d4ed8;
    }

    .main{
      text-align:center;
    }

    .icon{
      font-size:78px;
      margin:8px 0;
    }

    .temp{
      font-size:72px;
      font-weight:800;
      line-height:1;
    }

    .city{
      font-size:30px;
      font-weight:700;
      margin-top:8px;
    }

    .condition{
      color:#cbd5e1;
      margin-top:6px;
      font-size:18px;
      text-transform:capitalize;
    }

    .grid{
      margin-top:26px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .item{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      border-radius:20px;
      padding:18px;
    }

    .label{
      color:#94a3b8;
      font-size:13px;
      margin-bottom:6px;
    }

    .value{
      font-size:22px;
      font-weight:700;
    }

    .footer{
      margin-top:18px;
      text-align:center;
      color:#64748b;
      font-size:12px;
    }

    @media (max-width: 768px){
      body{
        padding:16px;
      }

      .card{
        max-width:100%;
        padding:24px;
        border-radius:24px;
      }

      .temp{
        font-size:58px;
      }

      .city{
        font-size:24px;
      }

      .condition{
        font-size:16px;
      }

      .icon{
        font-size:64px;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .value{
        font-size:20px;
      }

      .top{
        flex-direction:column;
      }

      button{
        width:100%;
        padding:14px;
      }

      input{
        width:100%;
      }

      .app-title h1{
        font-size:28px;
      }
    }

    @media (max-width: 480px){
      body{
        padding:12px;
      }

      .card{
        padding:20px;
        border-radius:20px;
      }

      .temp{
        font-size:48px;
      }

      .city{
        font-size:22px;
      }

      .condition{
        font-size:15px;
      }

      .icon{
        font-size:56px;
      }

      .label{
        font-size:12px;
      }

      .value{
        font-size:18px;
      }

      .footer{
        font-size:11px;
      }

      .app-title h1{
        font-size:24px;
      }

      .app-title p{
        font-size:12px;
      }
    }
  </style>
</head>

<body>

  <div id="rain"></div>

  <div class="card">

    <div class="app-title">
      <h1>🇮🇳 India Weather Live</h1>
      <p>Real-time weather across Indian cities</p>
    </div>

    <div class="top">
      <input type="text" id="cityInput" placeholder="Search Indian city (e.g. Surat, Mumbai)" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="main">
      <div class="icon" id="icon">☀️</div>
      <div class="temp" id="temp">--°</div>
      <div class="city" id="city">City</div>
      <div class="condition" id="condition">Condition</div>
    </div>

    <div class="grid">
      <div class="item">
        <div class="label">Humidity</div>
        <div class="value" id="humidity">--%</div>
      </div>

      <div class="item">
        <div class="label">Temperature</div>
        <div class="value" id="temp2">--°</div>
      </div>
    </div>

    <div class="footer">Live weather data</div>

  </div>

  <script>

    async function getWeather(){

      const city = document.getElementById('cityInput').value.trim();

      if(!city){
        alert('Enter city name');
        return;
      }

      try{

        const response = await fetch(`/weather?city=${city}`);
        const data = await response.json();

        document.getElementById('city').innerText = data.city;
        document.getElementById('temp').innerText = data.temperature;
        document.getElementById('temp2').innerText = data.temperature;
        document.getElementById('humidity').innerText = data.humidity;

        const condition = (data.condition || '').toLowerCase();

        document.getElementById('condition').innerText = condition || 'Live weather';

        setTheme(condition);

      }catch(e){
        alert('City not found');
      }
    }

    function setTheme(condition){

      stopRain();

      let icon = '☀️';

      if(condition.includes('rain') || condition.includes('drizzle') || condition.includes('shower')){

        icon = '🌧️';
        document.body.style.background = 'linear-gradient(180deg,#111827,#1f2937,#334155)';
        startRain();

      }else if(condition.includes('cloud')){

        icon = '☁️';
        document.body.style.background = 'linear-gradient(180deg,#1e293b,#334155,#475569)';

      }else if(condition.includes('storm') || condition.includes('thunder')){

        icon = '⛈️';
        document.body.style.background = 'linear-gradient(180deg,#020617,#111827,#1e293b)';
        startRain();

      }else if(condition.includes('snow')){

        icon = '❄️';
        document.body.style.background = 'linear-gradient(180deg,#334155,#64748b,#94a3b8)';

      }else{

        icon = '☀️';
        document.body.style.background = 'linear-gradient(180deg,#0f172a,#1e293b,#334155)';
      }

      document.getElementById('icon').innerText = icon;
    }

    function startRain(){

      const rain = document.getElementById('rain');
      rain.innerHTML = '';

      for(let i=0;i<90;i++){

        const d = document.createElement('div');
        d.className = 'drop';

        d.style.left = Math.random()*100 + 'vw';
        d.style.animationDuration = (0.6 + Math.random()*0.7) + 's';
        d.style.opacity = 0.2 + Math.random()*0.8;

        rain.appendChild(d);
      }
    }

    function stopRain(){
      document.getElementById('rain').innerHTML = '';
    }

  </script>

</body>
</html>
